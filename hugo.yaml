baseURL: "/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "学习札记"
theme: "PaperMod"

languages:
  zh-cn:
    locale: "zh-cn"
    label: "简体中文"
    direction: "ltr"
    weight: 1

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 8

minify:
  disableXML: true
  minifyOutput: true

params:
  env: "production"
  title: "学习札记"
  description: "每天记录要学什么，学到了什么，以及下一步继续往哪里走。"
  keywords: ["学习", "博客", "复盘", "笔记"]
  author: "学习札记"
  DateFormat: "2006-01-02"
  defaultTheme: "auto"
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "学习札记"
    Content: "把每天学到的东西写成可以再次阅读的文章：计划、理解、卡点、心得和下一步。"

menu:
  main:
    - identifier: posts
      name: "文章"
      url: /posts/
      weight: 10
    - identifier: archives
      name: "归档"
      url: /archives/
      weight: 20
    - identifier: search
      name: "搜索"
      url: /search/
      weight: 30
    - identifier: tags
      name: "标签"
      url: /tags/
      weight: 40
    - identifier: about
      name: "关于"
      url: /about/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
